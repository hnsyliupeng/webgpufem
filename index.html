<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MarineFEM — 海洋结构分析工作台（WebGPU）</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js" } }
</script>
</head>
<body>
<div id="shell">
<header>
  <h1>MarineFEM</h1>
  <span class="sub">OrcaFlex × DAVE 融合内核 · 集中质量线单元 + 网格水静力 + 三维梁 FEM · WebGPU</span>
  <span class="spacer"></span>
  <button class="btn" id="btnDoc">调研文档</button>
  <button class="btn" id="shotBtn">截图</button>
  <button class="btn" id="expJsonBtn">结果 JSON</button>
  <button class="btn" id="expCsvBtn">时程 CSV</button>
  <button class="btn" id="btnTheme">切换明暗</button>
</header>

<aside>
  <h2>验证算例</h2>
  <div id="caseList"></div>

  <h2>工况参数</h2>
  <div id="params"></div>

  <h2>环境载荷</h2>
  <div id="envParams">
    <div class="field"><label>波高 H (m) <b id="v_envH">0</b></label><input id="envH" type="range" min="0" max="8" step="0.5" value="0"></div>
    <div class="field"><label>波周期 T (s) <b id="v_envT">8</b></label><input id="envT" type="range" min="2" max="16" step="0.5" value="8"></div>
    <div class="field"><label>波向 (deg) <b id="v_envDir">0</b></label><input id="envDir" type="range" min="0" max="360" step="15" value="0"></div>
    <div class="field"><label>海流速 (m/s) <b id="v_envCur">0</b></label><input id="envCur" type="range" min="0" max="3" step="0.1" value="0"></div>
    <div class="field"><label>水深 (m) <b id="v_envDepth">100</b></label><input id="envDepth" type="range" min="10" max="300" step="10" value="100"></div>
    <div class="field"><label>海水密度 <b id="v_envRho">1025</b></label><input id="envRho" type="range" min="1000" max="1050" step="1" value="1025"></div>
  </div>

  <h2>求解控制</h2>
  <div class="row">
    <button class="btn primary" id="btnSolve">重新求解</button>
    <button class="btn" id="btnPlay">暂停</button>
  </div>
  <div class="row">
    <button class="btn" id="btnFit">复位视角</button>
    <select id="solverType" class="grow">
      <option value="static">静力分析</option>
      <option value="dynamic">非线性时域动力</option>
      <option value="freq">线性频域</option>
    </select>
  </div>
  <div class="row dynOnly">
    <div class="field grow"><label>时长 T(s) <b id="v_simTime">20</b></label><input id="simTime" type="range" min="5" max="300" step="5" value="20"></div>
    <div class="field grow"><label>步长 dt(s) <b id="v_simDt">0.005</b></label><input id="simDt" type="range" min="0.0005" max="0.02" step="0.0005" value="0.005"></div>
  </div>
  <div class="note" id="solverNote"></div>
</aside>

<main>
  <canvas id="gl"></canvas>
  <div id="hud"></div>
  <div id="backend"></div>
  <div id="legend"></div>
  <div id="animBar" class="hidden">
    <button class="btn small" id="playBtn">⏸</button>
    <input id="scrub" type="range" min="0" max="0" value="0" step="1">
    <span id="animTime" class="num">t = 0.00 s</span>
    <select id="animSpeed"><option value="0.25">0.25×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
  </div>
  <div id="drawer">
    <div class="tabs">
      <button class="btn" id="btnCloseDoc">返回视图</button>
      <span class="spacer"></span>
      <a class="btn" href="docs/OrcaFlex_vs_DAVE_深度对比调研.md" target="_blank">在新标签打开</a>
    </div>
    <iframe id="docFrame" src="docs/OrcaFlex_vs_DAVE_深度对比调研.md"></iframe>
  </div>
</main>

<div id="ledger">
  <h2>核验结论</h2>
  <div id="verdict"></div>
  <h2>数值对照</h2>
  <table class="ledger">
    <thead><tr><th>指标</th><th class="v">数值解</th><th class="v">解析解</th><th class="v">误差</th></tr></thead>
    <tbody id="ledgerRows"></tbody>
  </table>
  <h2 id="plotTitle">时程曲线</h2>
  <canvas class="plot" id="plot"></canvas>
  <h2>模型与日志</h2>
  <div class="note" id="theory"></div>
  <div class="note num" id="logPanel" style="max-height:180px;overflow-y:auto;white-space:pre-wrap"></div>
</div>

<footer>
  <span id="statLeft">就绪</span>
  <span class="spacer" style="flex:1"></span>
  <span id="statRight" class="num"></span>
</footer>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
