<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarineFEM · OrcaFlex × DAVE 工业级海洋结构分析平台</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js" } }
</script>
</head>
<body>
<header id="topbar">
  <div class="brand">🌊 MarineFEM <span class="sub">OrcaFlex × DAVE 融合内核 · 工业级工作台</span> <span id="gpuBadge" class="badge"></span></div>
  <div class="toolbar">
    <button id="runBtn" class="btn primary">▶ 运行分析</button>
    <button id="shotBtn" class="btn" title="导出当前视口截图">📷 截图</button>
    <button id="expJsonBtn" class="btn" title="导出结果 JSON">⬇ 结果 JSON</button>
    <button id="expCsvBtn" class="btn" title="导出时程 CSV">⬇ 时程 CSV</button>
    <div class="tabs">
      <button class="tab active" data-tab="analysis">分析工作台</button>
      <button class="tab" data-tab="doc">OrcaFlex vs DAVE 调研</button>
    </div>
  </div>
</header>

<main id="tab-analysis">
  <aside id="sidebar">
    <section class="panel">
      <h3>① 验证算例</h3>
      <select id="caseSelect"></select>
      <p id="caseDesc" class="desc"></p>
    </section>
    <section class="panel">
      <h3>② 模型参数</h3>
      <div id="paramPanel" class="params"></div>
    </section>
    <section class="panel">
      <h3>③ 环境载荷</h3>
      <div class="params">
        <label>波高 H (m)<input id="envH" type="number" value="0" step="0.5"></label>
        <label>波周期 T (s)<input id="envT" type="number" value="8" step="0.5"></label>
        <label>波向 (deg)<input id="envDir" type="number" value="0" step="15"></label>
        <label>海流速度 (m/s)<input id="envCur" type="number" value="0" step="0.1"></label>
        <label>水深 (m)<input id="envDepth" type="number" value="100" step="10"></label>
        <label>海水密度 (kg/m³)<input id="envRho" type="number" value="1025" step="1"></label>
      </div>
    </section>
    <section class="panel">
      <h3>④ 求解器设置</h3>
      <label>分析类型
        <select id="solverType">
          <option value="static">静力分析（Newton / 动态松弛 / FEM 静力）</option>
          <option value="dynamic">非线性时域动力（半隐式 Euler）</option>
          <option value="freq">线性频域（固有频率 / 水静力刚度）</option>
        </select>
      </label>
      <div class="params">
        <label class="dynOnly">时长 T(s)<input id="simTime" type="number" value="20" step="1"></label>
        <label class="dynOnly">步长 dt(s)<input id="simDt" type="number" value="0.005" step="0.001"></label>
        <label class="dynOnly">松弛阻尼(0=关)<input id="simDamp" type="number" value="0" step="1"></label>
      </div>
    </section>
  </aside>

  <section id="viewport">
    <canvas id="gl"></canvas>
    <div id="legend" class="overlay tl"></div>
    <div id="animBar" class="overlay bottom hidden">
      <button id="playBtn" class="btn small">⏸</button>
      <input id="scrub" type="range" min="0" max="0" value="0" step="1">
      <span id="animTime" class="mono">t = 0.00 s</span>
      <select id="animSpeed"><option value="0.25">0.25×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
    </div>
    <div id="vpStatus" class="overlay br mono"></div>
  </section>

  <aside id="results">
    <div class="rtabs">
      <button class="rtab active" data-rtab="res">验证结果</button>
      <button class="rtab" data-rtab="plot">时程曲线</button>
      <button class="rtab" data-rtab="tree">模型树</button>
      <button class="rtab" data-rtab="log">日志</button>
    </div>
    <section class="panel rpanel" id="rp-res">
      <table id="resultTable"><thead><tr><th>指标</th><th>数值解</th><th>解析解</th><th>相对误差</th></tr></thead><tbody></tbody></table>
    </section>
    <section class="panel rpanel hidden grow" id="rp-plot">
      <canvas id="plot"></canvas>
    </section>
    <section class="panel rpanel hidden" id="rp-tree"><div id="modelTree" class="tree mono"></div></section>
    <section class="panel rpanel hidden grow" id="rp-log"><div id="logPanel" class="log mono"></div></section>
  </aside>
</main>

<main id="tab-doc" class="hidden">
  <iframe id="docFrame" src="docs/OrcaFlex_vs_DAVE_深度对比调研.md"></iframe>
  <div class="doc-fallback">
    <p>调研文档：<a href="docs/OrcaFlex_vs_DAVE_深度对比调研.md" target="_blank">docs/OrcaFlex_vs_DAVE_深度对比调研.md</a>（建议在 GitHub 中阅读获得渲染与目录）</p>
  </div>
</main>

<footer id="statusbar" class="mono">
  <span id="stReady">就绪</span><span id="stModel"></span><span id="stSim"></span><span id="stFps"></span>
</footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
